# Render free-trial Blueprint: HTTP-only Laravel API plus one temporary Postgres database.
# The full production topology remains documented in render.production.yaml and is not imported by default.
services:
  - type: web
    runtime: docker
    name: mazad-trial-api
    region: frankfurt
    plan: free
    dockerfilePath: laravel/Dockerfile.render
    dockerContext: laravel
    dockerCommand: /usr/local/bin/render-trial-web
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Mazad Trial"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: mazad-trial-postgres
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: SCOUT_DRIVER
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "120"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRIAL_PUBLIC_FRONTEND_ORIGINS
        value: "https://mazad-marketplace.netlify.app"
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: FIRST_ADMIN_ENABLED
        sync: false
      - key: FIRST_ADMIN_NAME
        sync: false
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_PASSWORD
        sync: false

databases:
  - name: mazad-trial-postgres
    region: frankfurt
    plan: free
    databaseName: mazad_trial
    user: mazad_trial
    ipAllowList: []
